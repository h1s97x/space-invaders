name: contribution gif

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: h1s97x/space-invaders@v0.1.0
        with:
          source: github
          user: ${{ github.repository_owner }}
          token: ${{ github.token }}
          output: game.gif
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add game.gif
          git diff --quiet --cached || git commit -m 'chore: update contribution gif'
          git push
