[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-space-invaders"
dynamic = ["version"]
description = "Space Invaders — 把 GitHub 贡献图炸成像素 GIF，提交越多敌人越狠 💥"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "h1s97x"}]
dependencies = ["pillow>=10.0"]
keywords = ["github", "contributions", "game", "gif", "pixel", "shooter", "hacktoberfest"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Games/Entertainment :: Arcade",
]

[project.urls]
# 真身托管在 CNB；GitHub 侧同名仓库尚未建立（旧名 gh-pixel-pulverizer）。仓库就绪后切回 GitHub。
Homepage = "https://cnb.cool/h1s97x/plugins/gh-space-invaders"
Issues = "https://cnb.cool/h1s97x/plugins/gh-space-invaders/-/issues"

[project.scripts]
gh-space-invaders = "gh_space_invaders.cli:main"

# 版本号的唯一来源是 gh_space_invaders/__init__.py，避免两处维护
[tool.setuptools.dynamic]
version = {attr = "gh_space_invaders.__version__"}

[tool.setuptools.packages.find]
include = ["gh_space_invaders*"]
