[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gh-pixel-pulverizer"
version = "0.1.0"
description = "Pixel Pulverizer — 把 GitHub 贡献图炸成像素 GIF，提交越多敌人越狠 💥"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "pixel-pulverizer contributors"}]
dependencies = ["pillow>=10.0"]
keywords = ["github", "contributions", "game", "gif", "pixel", "shooter", "hacktoberfest"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Arcade",
]

[project.scripts]
gh-pixel-pulverizer = "gh_pixel_pulverizer.cli:main"

[tool.setuptools.packages.find]
include = ["gh_pixel_pulverizer*"]
