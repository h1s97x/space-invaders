name: 'Space Invaders Contribution GIF'
description: '把贡献日历渲染成一张像素动画 GIF（平台无关镜像）'
author: 'h1s97x'
branding:
  icon: 'play-circle'
  color: 'green'

# 内核只认 CONTRIB_*：这里把它们从 inputs 映射好，是本文件唯一的职责。
# 不写 GITHUB_OUTPUT、不提交仓库 —— 产物就是一个文件，交给调用方的工作流处理。
inputs:
  source:
    description: '数据源 id：github | cnb | file | mock'
    required: false
    default: 'github'
  user:
    description: '目标用户名（留空则用仓库 owner）'
    required: false
    default: ''
  token:
    description: '访问令牌（留空则用 github.token）'
    required: false
    default: ''
  endpoint:
    description: '可选 API 基址覆盖'
    required: false
    default: ''
  calendar:
    description: 'file 源读取的归一化日历路径'
    required: false
    default: ''
  output:
    description: '产物文件名'
    required: false
    default: 'game.gif'
  seed:
    description: '固定随机种子'
    required: false
    default: '1'
  fps:
    description: '播放帧率 10..50'
    required: false
    default: '20'
  scale:
    description: '整数倍放大 1..8（画布已够大，默认不放大）'
    required: false
    default: '1'
  width:
    description: '低分辨率画布宽（放大前，53 列 × 16px 全览）'
    required: false
    default: '1024'
  height:
    description: '低分辨率画布高（放大前，含 HUD、地平线与飞船区）'
    required: false
    default: '256'
  max_frames:
    description: '帧数硬上界'
    required: false
    default: '4800'
  rule:
    description: '规则注册表 id'
    required: false
    default: 'waves'
  renderer:
    description: '渲染注册表 id'
    required: false
    default: 'invader'

runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    CONTRIB_SOURCE: ${{ inputs.source }}
    CONTRIB_USER: ${{ inputs.user || github.repository_owner }}
    CONTRIB_TOKEN: ${{ inputs.token || github.token }}
    CONTRIB_ENDPOINT: ${{ inputs.endpoint }}
    CONTRIB_CALENDAR: ${{ inputs.calendar }}
    CONTRIB_OUTPUT: ${{ inputs.output }}
    CONTRIB_SEED: ${{ inputs.seed }}
    CONTRIB_FPS: ${{ inputs.fps }}
    CONTRIB_SCALE: ${{ inputs.scale }}
    CONTRIB_WIDTH: ${{ inputs.width }}
    CONTRIB_HEIGHT: ${{ inputs.height }}
    CONTRIB_MAX_FRAMES: ${{ inputs.max_frames }}
    CONTRIB_RULE: ${{ inputs.rule }}
    CONTRIB_RENDERER: ${{ inputs.renderer }}
