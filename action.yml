name: 'GitHub Contribution Space Invaders'
description: '把 GitHub 贡献图渲染成一场像素轰炸游戏的 GIF'
author: 'h1s97x'
branding:
  icon: 'play-circle'
  color: 'green'

inputs:
  username:
    description: 'GitHub 用户名（留空则用仓库 owner）'
    required: false
    default: ''
  strategy:
    description: '清除策略：random（默认）| column | row | chaos'
    required: false
    default: 'random'
  fps:
    description: '播放帧率（参考项目默认 40）'
    required: false
    default: '40'
  colors:
    description: 'GIF 调色板颜色数'
    required: false
    default: '32'
  seed:
    description: '随机种子（留空则每次结果不同，便于生成多张候选）'
    required: false
    default: ''
  output:
    description: '输出文件名（相对工作目录）'
    required: false
    default: 'space-invaders.gif'

runs:
  using: 'composite'
  steps:
    # 依赖与编译都在 action 自己的目录里做，不污染使用方的仓库
    - name: 安装依赖并编译
      shell: bash
      run: |
        set -euo pipefail
        cd "${{ github.action_path }}"
        npm ci
        npm run build

    - name: 生成 GIF
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        IN_USERNAME: ${{ inputs.username }}
        IN_STRATEGY: ${{ inputs.strategy }}
        IN_FPS: ${{ inputs.fps }}
        IN_COLORS: ${{ inputs.colors }}
        IN_SEED: ${{ inputs.seed }}
        IN_OUTPUT: ${{ inputs.output }}
      run: |
        set -euo pipefail
        ARGS=(--strategy "$IN_STRATEGY" --fps "$IN_FPS" --colors "$IN_COLORS" --output "$IN_OUTPUT")
        if [ -n "$IN_USERNAME" ]; then ARGS+=(--user "$IN_USERNAME"); fi
        if [ -n "$IN_SEED" ]; then ARGS+=(--seed "$IN_SEED"); fi
        cd "${{ github.action_path }}"
        node dist/index.js "${ARGS[@]}"
        # 产物搬到工作目录，方便后续步骤 upload-artifact
        cp "$IN_OUTPUT" "$GITHUB_WORKSPACE/$IN_OUTPUT"
        ls -la "$GITHUB_WORKSPACE/$IN_OUTPUT"

    - name: 输出参数
      shell: bash
      run: |
        echo "path=${{ inputs.output }}" >> "$GITHUB_OUTPUT"
        echo "bytes=$(stat -c%s "${{ inputs.output }}" 2>/dev/null || echo 0)" >> "$GITHUB_OUTPUT"

  token:
    description: '可选：用于读取非公开贡献数据的 PAT，默认用 github.token'
    required: false
    default: ''

outputs:
  path:
    description: '生成的 GIF 相对路径'
    value: ${{ steps.outputs.path }}
  bytes:
    description: 'GIF 字节数'
    value: ${{ steps.outputs.bytes }}
