name: ✨ 功能建议
description: 提出一个新功能或改进想法
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 从「问题」出发而不是「方案」出发更容易达成共识
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你设想的做法
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过其他方案吗
  - type: dropdown
    id: scope
    attributes:
      label: 这会影响什么
      options:
        - 只影响观感
        - 影响玩法/手感
        - 影响工程（性能、体积、测试）
        - 影响 CLI / 接口
    validations:
      required: true
