name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: smoke (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 🐍 Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow

      - name: ✅ Smoke tests
        run: python -m unittest discover -s tests -v

      - name: 💥 Generate GIF offline (端到端跑一遍)
        run: |
          python -m gh_pixel_pulverizer octocat --offline \
            -o game.gif --seed 7
          python - <<'PY'
          import os
          size = os.path.getsize("game.gif")
          assert size > 0, "GIF 没有产出"
          print(f"game.gif = {size / 1e6:.2f} MB")
          PY

      - name: 📦 Upload GIF
        uses: actions/upload-artifact@v4
        with:
          name: game-gif-py${{ matrix.python-version }}
          path: game.gif
          retention-days: 7
