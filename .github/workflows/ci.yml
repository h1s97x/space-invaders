name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check

      - name: 校验镜像契约
        run: |
          test -s Dockerfile
          test -s entrypoint.sh
          sh -n entrypoint.sh
          grep -q "using: 'docker'" action.yml
          grep -q "image: 'Dockerfile'" action.yml

      - name: 离线冒烟
        env:
          CONTRIB_SOURCE: mock
          CONTRIB_MAX_FRAMES: '10'
          CONTRIB_OUTPUT: smoke.gif
        run: |
          node dist/src/cli/index.js
          test -s smoke.gif

      - name: 容器构建与镜像内运行
        run: |
          docker build -t space-invaders:ci .
          docker run --rm -e CONTRIB_SOURCE=mock -e CONTRIB_MAX_FRAMES=10 -e CONTRIB_OUTPUT=/tmp/out.gif space-invaders:ci
