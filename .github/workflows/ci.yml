name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ci 里不装 Playwright 之类的大依赖，@napi-rs/canvas 是预编译二进制
      - name: 安装依赖
        run: npm ci

      - name: 类型检查 + 编译
        run: npm run build

      - name: 单元测试
        run: npm test

      - name: 冒烟测试（离线生成一份 GIF）
        run: node dist/index.js --offline --seed 1 --quiet -o /tmp/smoke.gif

      - name: 上传冒烟产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-gif
          path: /tmp/smoke.gif
          retention-days: 3
