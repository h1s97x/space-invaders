# CNB 主仓（唯一源）。GitHub 侧只作 uses: 分发端点，没有反向同步工作流。
# 注意：CNB 的 script 必须是字符串块（script: |）。

main:
  push:
    - name: verify
      stages:
        - name: check
          image: docker.io/library/node:22
          script: |
            set -e
            npm ci --no-audit --no-fund
            npm run check
        - name: image-contract
          image: docker.io/library/node:22
          script: |
            set -e
            test -s Dockerfile
            test -s entrypoint.sh
            sh -n entrypoint.sh
            grep -q "using: 'docker'" action.yml
            grep -q "image: 'Dockerfile'" action.yml
        - name: smoke
          image: docker.io/library/node:22
          script: |
            set -e
            npm ci --no-audit --no-fund
            npm run build
            CONTRIB_SOURCE=mock CONTRIB_MAX_FRAMES=10 CONTRIB_OUTPUT=/tmp/smoke.gif node dist/src/cli/index.js
            test -s /tmp/smoke.gif

  pull_request:
    - name: verify
      stages:
        - name: check
          image: docker.io/library/node:22
          script: |
            set -e
            npm ci --no-audit --no-fund
            npm run check
        - name: image-contract
          image: docker.io/library/node:22
          script: |
            set -e
            test -s Dockerfile
            test -s entrypoint.sh
            sh -n entrypoint.sh
            grep -q "using: 'docker'" action.yml

# tag 发布：把同一份 Dockerfile 构建成插件镜像推到本仓库制品库。
v*:
  tag_push:
    - name: publish-plugin-image
      services:
        - docker
      stages:
        - name: build-and-push
          script: |
            set -e
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            TAG="${CNB_BRANCH}"
            echo "${CNB_TOKEN}" | docker login "${CNB_DOCKER_REGISTRY}" -u cnb --password-stdin
            docker build -t "${IMAGE}:${TAG}" -t "${IMAGE}:latest" .
            docker push "${IMAGE}:${TAG}"
            docker push "${IMAGE}:latest"
