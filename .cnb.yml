# CNB 流水线配置
#
# 参考 h1s97x/action-gh-social-graph 与 h1s97x/sdutex 的流水线设计。
#
#   0. 双向同步总览：
#      - CNB → GitHub：本流水线 push 到 main 时自动同步（第 1 条）
#      - GitHub → CNB：由 .github/workflows/sync-cnb.yml 兜底反向同步，
#        两侧都排除 .cnb* / .github/ 路径，避免同步环死循环。
#   1. 构建门禁：Node 22 → 装依赖 → 类型检查 → 单元测试 → 离线冒烟出图。
#      门禁在同步之前，测试不过就不会往 GitHub 推。
#   2. Git Sync：用官方 tencentcom/git-sync 插件同步到 GitHub，
#      sync_mode: rebase —— 保留 GitHub 侧特有的平台文件，且不无条件 force。
#   3. PR / Issue 自动分配处理人。
#   4. Tag 发布：v* 触发时生成 GIF 并创建 Release。
#
# ⚠️ 注意：CNB 的 script 必须是**字符串块**（script: |）。
#    写成GitHub Actions 那种「name/command 对象数组」会被拼成
#    `[object Object] && ...` 然后 sh 报 `not found`（退出码 127）。

main:
  push:
    - name: build-and-sync
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: build
          image: docker.io/library/node:22
          script: |
            set -e
            npm ci
            npm run build
            npm test
            node dist/index.js --offline --seed 1 --quiet -o dist/smoke.gif

        - name: sync to github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/gh-space-invaders.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            branch: main
            push_tags: true
            sync_mode: rebase
            git_user: h1s97x
            git_email: 1297656998@outlook.com

  pull_request:
    - name: auto-assign-pr-owner
      env:
        PR_ASSIGNEE: h1s97x
      stages:
        - name: assign pr to owner
          type: git:reviewer
          options:
            type: add-assignee
            reviewers: ${PR_ASSIGNEE}
        - name: add pr reviewer
          type: git:reviewer
          options:
            type: add-reviewer-from-repo-members

$:
  api_trigger:
    - name: verify
      docker:
        image: docker.io/library/node:22
      stages:
        - name: check
          script: |
            set -e
            npm ci
            npm run build
            npm test
            node dist/index.js --offline --seed 1 --quiet -o dist/smoke.gif
            ls -la dist/smoke.gif

  web_trigger_pull_from_github:
    - name: web-trigger-pull-from-github
      imports:
        - https://cnb.cool/h1s97x/secret-env/-/blob/main/env.yml
      stages:
        - name: pull from github
          image: tencentcom/git-sync
          settings:
            target_url: https://github.com/h1s97x/gh-space-invaders.git
            auth_type: https
            username: ${GITHUB_USERNAME}
            password: ${GITHUB_TOKEN}
            sync_mode: pull

  issue.open:
    - name: auto-assign-issue-owner
      env:
        ISSUE_ASSIGNEE: h1s97x
      stages:
        - name: assign issue to owner
          image: cnbcool/cnb-cli
          script: |
            set -e
            cnb issues add-assignees --assignees $ISSUE_ASSIGNEE

  tag_push:
    - name: release
      docker:
        image: docker.io/library/node:22
      stages:
        - name: build release asset
          script: |
            set -e
            npm ci
            npm run build
            npm test
            node dist/index.js --offline --seed 1 --quiet -o dist/demo.gif
        - name: create release
          type: git:release
          options:
            descriptionFromFile: CHANGELOG.md
        - name: upload release assets
          image: cnbcool/attachments:latest
          settings:
            attachments:
              - "./dist/demo.gif"
              - "./LICENSE"
              - "./NOTICE"
              - "./README.md"
